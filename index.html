<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Card - Dina Mahmoud Ahmed Metwally</title>
    <style>
        :root {
            /* Physical dimensions of a standard bank card */
            --card-width: 85.6mm;
            --card-height: 54mm;
            --card-radius: 3.18mm;

            /* Colors - Metallic Blue Theme */
            --color-bg-page: #0f172a; /* Dark background to make the card pop */
            --color-card-main: #1e3c5a; /* Deep metallic blue */
            --color-card-light: #3a6b8c; /* Lighter metallic highlight */
            --color-card-dark: #0a192f; /* Dark blue accent */
            
            /* Text Colors */
            --color-text-beige: #f5f5dc; /* Beige accent for primary text */
            --color-text-muted: #94a3b8; /* Muted text for labels */
            --color-text-light: #e2e8f0; /* Soft white for general text */
            
            /* Shadows and FX */
            --shadow-ambient: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 4px 10px -2px rgba(0, 0, 0, 0.3);
            --edge-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.4), inset 0 -1px 1px rgba(0, 0, 0, 0.4), inset 1px 0 1px rgba(255, 255, 255, 0.2);
            
            /* Typography */
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --focus-outline: 2px solid var(--color-text-beige);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg-page);
            color: var(--color-text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- LAYOUT & 3D SCENE --- */
        .scene {
            perspective: 1000px;
            /* Extra padding to ensure shadow doesn't clip on small screens */
            padding: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- THE CARD --- */
        .card {
            position: relative;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            background: linear-gradient(135deg, var(--color-card-light) 0%, var(--color-card-main) 40%, var(--color-card-dark) 100%);
            box-shadow: var(--shadow-ambient);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.2s ease-out;
            display: flex;
            flex-direction: row;
            padding: 4mm;
            gap: 4mm;
            overflow: hidden;
        }

        /* Realistic Edge Highlight */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            box-shadow: var(--edge-highlight);
            pointer-events: none;
            z-index: 10;
        }

        /* Faint Sheen of Light */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            background: linear-gradient(
                105deg,
                transparent 0%,
                transparent 35%,
                rgba(255, 255, 255, 0.15) 45%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0.15) 55%,
                transparent 65%,
                transparent 100%
            );
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 11;
        }

        /* --- CARD INTERNAL LAYOUT --- */
        .card-left {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2; /* Keep above sheen if needed, but sheen is transparent */
        }

        .card-right {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }

        /* --- LEFT COLUMN: PHOTO & IDENTITY --- */
        .photo-container {
            position: relative;
            width: 14mm; /* Scaled to physical mm for the rounded square */
            height: 14mm;
            border-radius: 2mm;
            background-color: var(--color-card-dark);
            overflow: hidden;
            margin-bottom: 3mm;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .photo-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-beige);
            font-weight: 700;
            font-size: 4.5mm;
            letter-spacing: 0.5px;
        }

        .photo-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* Sits above fallback text */
        }

        .name {
            font-size: 3.8mm;
            font-weight: 700;
            color: var(--color-text-beige);
            line-height: 1.1;
            margin-bottom: 1.5mm;
            letter-spacing: -0.2px;
        }

        .title {
            font-size: 2.5mm;
            font-weight: 600;
            color: var(--color-text-light);
            margin-bottom: 0.5mm;
        }

        .org {
            font-size: 2.2mm;
            font-weight: 400;
            color: var(--color-text-muted);
            font-style: italic;
        }

        /* --- RIGHT COLUMN: CONTACT & SOCIALS --- */
        .contact-group {
            display: flex;
            flex-direction: column;
        }

        /* 44px tap target minimums for touch devices */
        .tap-target {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 44px; /* Essential mobile touch target size */
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
            margin-left: -4px; /* Pull back to align visually despite padding */
            padding: 0 4px;
        }

        .tap-target:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .tap-target:focus-visible, .social-icon:focus-visible {
            outline: var(--focus-outline);
            outline-offset: 2px;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Non-link group (City) styling to match the structure of links */
        .static-target {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 30px; /* Does not need 44px as it's not clickable, saves space */
        }

        .label {
            font-size: 2mm;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
            margin-bottom: 1px;
        }

        .value {
            font-size: 2.8mm;
            font-weight: 500;
            color: var(--color-text-beige);
        }

        /* --- SOCIAL ICONS --- */
        .social-row {
            display: flex;
            align-items: center;
            gap: 2mm;
            min-height: 44px; /* 44px touch target row */
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px; /* Width + touch area */
            height: 44px; /* Height for touch area */
            color: var(--color-text-beige);
            text-decoration: none;
            border-radius: 4px;
            transition: color 0.2s, transform 0.2s;
        }

        .social-icon svg {
            width: 4.5mm;
            height: 4.5mm;
            fill: currentColor;
        }

        .social-icon:not(.disabled):hover {
            color: #fff;
            transform: translateY(-1px);
        }

        .social-icon.disabled {
            color: var(--color-text-muted);
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* --- PRINT BUTTON --- */
        .print-btn {
            margin-top: 30px;
            background-color: transparent;
            border: 1px solid var(--color-card-light);
            color: var(--color-text-beige);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .print-btn:hover, .print-btn:focus-visible {
            background-color: var(--color-card-light);
            color: #fff;
            outline: var(--focus-outline);
            outline-offset: 4px;
        }

        .print-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* --- PRINT MEDIA QUERY --- */
        @media print {
            /* Hide everything by default */
            body * {
                visibility: hidden;
            }
            
            /* Show only the scene and card */
            .scene, .scene * {
                visibility: visible;
            }
            
            /* Remove background, centers, and 3D transforms */
            body {
                background: white;
                min-height: auto;
                display: block;
            }

            .scene {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                padding: 0;
                transform: none !important;
            }

            .card {
                transform: none !important;
                box-shadow: none !important;
                border: 1px solid #ccc; /* Ensure edge is visible on white paper */
                /* Force background colors and gradients to print */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin: 0;
            }

            .print-btn {
                display: none !important;
            }

            /* Suggest physical size to the printer */
            @page {
                size: var(--card-width) var(--card-height);
                margin: 0;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('identity-card');
            
            // Check system preferences to respect reduced-motion settings
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            // Apply the 3D tilt effect if the user hasn't requested reduced motion
            card.addEventListener('mousemove', (e) => {
                if (prefersReducedMotion.matches) return;

                // Calculate the exact bounding box on every move to handle scrolling
                const rect = card.getBoundingClientRect();
                
                // Get mouse position relative to the element
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Find the center of the element
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // Calculate subtle rotation values based on cursor distance from center
                // Maximum tilt is 8 degrees to keep the card readable
                const rotateX = ((y - centerY) / centerY) * -8;
                const rotateY = ((x - centerX) / centerX) * 8;
                
                // Apply the transform
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            // Smoothly settle the card back to flat when the mouse leaves
            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            });
        });
    </script>
